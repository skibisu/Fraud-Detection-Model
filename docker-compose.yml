services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frauddb}
      POSTGRES_USER: ${POSTGRES_USER:-frauduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frauduser} -d ${POSTGRES_DB:-frauddb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  model-service:
    build: ./model-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-frauddb}
      DB_USERNAME: ${POSTGRES_USER:-frauduser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fraudpass}
      MODEL_SERVICE_URL: http://model-service:8000
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
      model-service:
        condition: service_healthy

volumes:
  postgres_data:

